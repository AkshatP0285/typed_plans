[project]
name = "tpj"
version = "0.1.0"
description = "Typed Plans, Lightweight Judges: execution-aware verification for tool-calling agents"
requires-python = ">=3.10"
dependencies = [
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "pydantic>=2.6",
    "openai>=1.40",
    "httpx>=0.27",
    "diskcache>=5.6",
    "datasets>=2.19",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# local models: Laya gate and QLoRA fine-tuning
gpu = [
    "torch>=2.3",
    "transformers>=4.51",
    "peft>=0.12",
    "trl>=0.20",
    "bitsandbytes>=0.43",
    "accelerate>=0.33",
]
serve = ["vllm>=0.8"]
# tau2-bench is installed from source: pip install git+https://github.com/sierra-research/tau2-bench
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src"]
