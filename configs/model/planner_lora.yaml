# Fine-tuned (QLoRA) IR planner = LoRA module 'ir_planner' on the small vLLM server.
_target_: tpj.llm.client.LLMClient
name: qwen3-8b-ir-lora
model: ir_planner
base_url: ${oc.env:VLLM_SMALL_URL,http://localhost:8000/v1}
api_key_env: null
temperature: 0.0
max_tokens: 4096
structured_output: response_format
extra_body:
  chat_template_kwargs: {enable_thinking: false}
cache_dir: ${llm_cache_dir}
max_concurrency: 32
